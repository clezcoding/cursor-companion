<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CursorCompanion UI Mockup</title>
    <style>
        :root {
            --bg-primary: #121212;
            --bg-secondary: #1c1c1c;
            --bg-tertiary: #2a2a2a;
            
            --text-primary: #ffffff;
            --text-secondary: #999999;
            --text-muted: #737373;
            
            --accent-success: #10B981;
            --accent-warning: #F59E0B;
            --accent-error: #F43F5E;
            
            --border-default: #262626;
            
            --radius-md: 8px;
            --radius-sm: 6px;
        }

        body {
            background-color: #000;
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            gap: 40px;
            padding: 40px;
            margin: 0;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* Popover Styling */
        .popover {
            width: 270px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-default);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .account-tabs {
            display: flex;
            gap: 6px;
        }

        .account-tab {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 4px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease-out;
        }

        .account-tab.active {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .account-tab:hover:not(.active) {
            background-color: var(--bg-secondary);
        }

        .account-tab:active {
            transform: scale(0.97);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--accent-success);
            box-shadow: 0 0 8px rgba(16, 185, 129, 0.4);
        }

        .countdown {
            font-size: 11px;
            color: var(--text-muted);
            font-family: monospace;
        }

        /* Metric Block */
        .metric-block {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            border: 1px solid transparent;
            transition: border-color 0.2s ease;
        }

        .metric-block:hover {
            border-color: var(--border-default);
        }

        .metric-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
        }

        .metric-title {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .metric-value {
            font-size: 13px;
            font-weight: 700;
            font-family: monospace;
            color: var(--accent-success);
        }

        .metric-value.warning {
            color: var(--accent-warning);
        }

        .metric-label {
            font-size: 10px;
            color: var(--text-secondary);
            margin-left: 4px;
        }

        .progress-track {
            height: 3px;
            background-color: var(--border-default);
            border-radius: 2px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background-color: var(--accent-success);
            border-radius: 2px;
            width: 45%;
        }

        .progress-fill.warning {
            background-color: var(--accent-warning);
            width: 82%;
        }

        .metric-footer {
            display: flex;
            justify-content: space-between;
            font-size: 10px;
            color: var(--text-muted);
        }

        /* Footer */
        .popover-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 12px;
            border-top: 1px solid var(--border-default);
        }

        .sync-status {
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .sync-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--text-muted);
        }

        .actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background-color: var(--bg-secondary);
            color: var(--text-secondary);
            border: none;
            padding: 6px 10px;
            border-radius: var(--radius-sm);
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease-out;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn:hover {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Settings View */
        .settings-window {
            width: 500px;
            height: 380px;
            background-color: var(--bg-primary);
            border: 1px solid var(--border-default);
            border-radius: 10px;
            display: flex;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
        }

        .sidebar {
            width: 140px;
            background-color: rgba(28, 28, 28, 0.5);
            border-right: 1px solid var(--border-default);
            padding: 12px 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .sidebar-title {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 8px 12px 8px;
            color: var(--text-primary);
        }

        .nav-item {
            padding: 6px 8px;
            border-radius: var(--radius-sm);
            font-size: 12px;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.15s ease-out;
        }

        .nav-item.active {
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            font-weight: 600;
        }

        .nav-item:hover:not(.active) {
            background-color: var(--bg-secondary);
        }
        
        .nav-item:active {
            transform: scale(0.97);
        }

        .content {
            flex: 1;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .content-title {
            font-size: 14px;
            font-weight: 700;
            margin: 0 0 16px 0;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
        }

        .setting-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-name {
            font-size: 12px;
            font-weight: 500;
        }

        .setting-desc {
            font-size: 11px;
            color: var(--text-secondary);
        }

        /* Toggle switch */
        .toggle {
            width: 36px;
            height: 20px;
            background-color: var(--accent-success);
            border-radius: 10px;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .toggle::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            background-color: white;
            border-radius: 50%;
            top: 2px;
            right: 2px;
            transition: all 0.2s;
        }

        .toggle.off {
            background-color: var(--border-default);
        }

        .toggle.off::after {
            right: 18px;
            background-color: var(--text-secondary);
        }

        .badge {
            font-size: 9px;
            font-weight: 700;
            padding: 2px 6px;
            background-color: rgba(16, 185, 129, 0.15);
            color: var(--accent-success);
            border-radius: 4px;
        }

        .badge.pro {
            background-color: var(--bg-tertiary);
            color: var(--accent-warning);
        }

    </style>
</head>
<body>

    <!-- Popover Mockup -->
    <div class="popover">
        <div class="header-row">
            <div class="account-tabs">
                <div class="account-tab active">
                    <div class="status-dot"></div>
                    Work
                </div>
                <div class="account-tab">
                    Personal
                </div>
            </div>
            <div class="countdown">
                PRO · 15d
            </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 14px;">
            <!-- Metric 1 -->
            <div class="metric-block">
                <div class="metric-header">
                    <div class="metric-title">Cursor Models</div>
                    <div>
                        <span class="metric-value">45%</span>
                        <span class="metric-label">verbraucht</span>
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill"></div>
                </div>
                <div class="metric-footer">
                    <span>Composer & Grok Pool</span>
                    <span style="font-family: monospace;">55% frei</span>
                </div>
            </div>

            <!-- Metric 2 -->
            <div class="metric-block">
                <div class="metric-header">
                    <div class="metric-title">Other Models</div>
                    <div>
                        <span class="metric-value warning">82%</span>
                        <span class="metric-label">verbraucht</span>
                    </div>
                </div>
                <div class="progress-track">
                    <div class="progress-fill warning"></div>
                </div>
                <div class="metric-footer">
                    <span>Claude 3.7 & GPT-4o</span>
                    <span style="font-family: monospace;">18% frei</span>
                </div>
            </div>
        </div>

        <div class="popover-footer">
            <div class="sync-status">
                <div class="sync-dot"></div>
                just now
            </div>
            <div class="actions">
                <button class="btn">Sync</button>
                <button class="btn" style="padding: 6px;">⚙️</button>
            </div>
        </div>
    </div>

    <!-- Settings Mockup -->
    <div class="settings-window">
        <div class="sidebar">
            <div class="sidebar-title">CursorCompanion</div>
            <div class="nav-item active">Allgemein</div>
            <div class="nav-item">Accounts</div>
            <div class="nav-item">Berechtigungen</div>
            <div class="nav-item">Über</div>
        </div>
        <div class="content">
            <h2 class="content-title">Accounts verwalten</h2>
            
            <div class="setting-row">
                <div class="setting-info">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="setting-name">janedoe@work.com</span>
                        <span class="badge">AKTIV</span>
                        <span class="badge pro">PRO</span>
                    </div>
                    <span class="setting-desc" style="font-family: monospace;">acct_123456</span>
                </div>
                <button class="btn">Umbenennen</button>
            </div>

            <div class="setting-row">
                <div class="setting-info">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <span class="setting-name">Personal (Free)</span>
                        <span class="badge" style="background: var(--border-default); color: var(--text-secondary);">CACHED</span>
                    </div>
                    <span class="setting-desc" style="font-family: monospace;">acct_987654</span>
                </div>
                <div style="display: flex; gap: 8px;">
                    <button class="btn">Umbenennen</button>
                    <button class="btn" style="color: var(--accent-error);">Entfernen</button>
                </div>
            </div>
            
            <div style="margin-top: auto; display: flex; justify-content: flex-end; padding-top: 16px; border-top: 1px solid var(--border-default);">
                <button class="btn" style="background-color: white; color: black; font-weight: 600;">Fertig</button>
            </div>
        </div>
    </div>

</body>
</html>
