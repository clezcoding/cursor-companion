name: 🐛 Bug Report
description: Create a report to help us improve Cursor Companion
title: "fix: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: input
    id: summary
    attributes:
      label: Summary
      description: A concise description of the problem.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to Reproduce
      description: How can we reproduce this issue?
      placeholder: |
        1. Start OpenUsage
        2. Launch Cursor Companion
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: openusage-version
    attributes:
      label: OpenUsage & Cursor Status
      description: Is OpenUsage running on port 6736 and are you logged into Cursor?
      placeholder: "e.g. OpenUsage v0.4.0 running locally, Cursor Pro logged in"
  - type: textarea
    id: logs
    attributes:
      label: Logs / Error Output
      description: Please copy and paste any relevant console or terminal error logs.
      render: shell
