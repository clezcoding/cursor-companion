name: Release App

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Build App
        run: ./build_app.sh

      - name: Prepare Update Directory
        run: |
          mkdir -p SparkleUpdates
          # Die App zippen für den Download
          cd .build
          zip -r -y -9 ../SparkleUpdates/CursorCompanion.zip CursorCompanion.app
          cd ..

      - name: Generate Appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          echo "$SPARKLE_PRIVATE_KEY" | ./.build/artifacts/sparkle/Sparkle/bin/generate_appcast --ed-key-file - SparkleUpdates/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            SparkleUpdates/CursorCompanion.zip
            SparkleUpdates/appcast.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
