name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Skills & Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Validate stitch-react-components
        run: |
          cd .agents/skills/stitch-react-components
          npm ci || npm install
          node scripts/validate.js examples/gold-standard-card.tsx

      - name: Validate stitch-react-native
        run: |
          cd .agents/skills/stitch-react-native
          npm ci || npm install
          node scripts/validate.js examples/gold-standard-card.tsx

      - name: Verify JSON Integrity
        run: |
          node -e '
            const fs = require("fs");
            const files = ["skills-lock.json"];
            files.forEach(f => {
              if (fs.existsSync(f)) {
                JSON.parse(fs.readFileSync(f, "utf8"));
                console.log(`✓ Validated ${f}`);
              }
            });
          '
